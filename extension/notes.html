<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заметки · easy-read</title>
  <style>
    :root { --paper: #fbf7ef; --ink: #2b2622; --soft: #6b6259; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --paper: #1d1f22; --ink: #ece6dc; --soft: #b6ab9c; } }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 48rem; margin: 0 auto; padding: 16px 16px 0; }
    #status { color: var(--soft); min-height: 1.6em; margin: 0; }
    /* the panel of notes.js is the page here; there is nothing to read aloud */
    body.er-notes-page #er-notes { position: static; width: auto; max-width: 48rem; margin: 0 auto 96px; box-shadow: none; overflow: visible; }
    body.er-notes-page #er-read { display: none; }
  </style>
</head>
<body class="er-notes-page">
<main><p id="status" role="status"></p></main>
<script type="module" src="notes-page.js"></script>
</body>
</html>
