<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading list · easy-read</title>
  <style>
    :root {
      --paper: #fbf7ef; --ink: #2b2622; --soft: #6b6259; --line: #e5dccb; --card: #fffdf8;
      --accent: #9a4f31; --on-accent: #fffdf8; --bad: #a33a2a;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #1d1f22; --ink: #ece6dc; --soft: #b6ab9c; --line: #3a3d42; --card: #26282c;
        --accent: #e08a63; --on-accent: #1d1f22; --bad: #ef8a78; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 52rem; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 16px; }
    h2 { font-size: 1.1rem; margin: 28px 0 8px; color: var(--soft); }
    .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input[type=search] { flex: 1; min-width: 12rem; font: inherit; color: inherit; background: var(--card);
      border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    button, .btn { font: inherit; font-size: .9rem; font-weight: 600; color: var(--ink); background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 5px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    li { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; display: grid; gap: 8px; }
    li.drag { outline: 3px dashed var(--accent); }
    .title { margin: 0; font-weight: 600; line-height: 1.35; }
    .title span { color: var(--soft); font-weight: 400; }
    .soft { color: var(--soft); font-size: .9rem; margin: 0; }
    #status { color: var(--soft); min-height: 1.6em; }
    #status.bad { color: var(--bad); }
    [hidden] { display: none; }
  </style>
</head>
<body>
<main>
  <h1>Reading list</h1>
  <div class="bar">
    <input type="search" id="search" placeholder="Поиск по автору и названию" aria-label="Поиск по списку чтения">
    <button type="button" id="reload">Обновить</button>
    <a class="btn" href="options.html">Настройки</a>
  </div>
  <p id="status" role="status">Загружаю список из Zotero…</p>
  <div id="groups"></div>
  <input id="file" type="file" accept="application/pdf" hidden>
</main>
<script type="module" src="reading.js"></script>
</body>
</html>
