<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>easy-read PDF</title>
  <style>
    :root {
      --paper: #fbf7ef; --ink: #2b2622; --soft: #6b6259; --line: #e5dccb; --card: #fffdf8;
      --accent: #9a4f31; --on-accent: #fffdf8; --shadow: 0 6px 24px rgba(43, 38, 34, .12);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #1d1f22; --ink: #ece6dc; --soft: #b6ab9c; --line: #3a3d42; --card: #26282c;
        --accent: #e08a63; --on-accent: #1d1f22; --shadow: 0 6px 24px rgba(0, 0, 0, .4); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink);
      font: 19px/1.65 Charter, "Iowan Old Style", Georgia, serif; }
    .bar { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line);
      padding: 12px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center;
      font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .kicker { margin: 0; color: var(--soft); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 18px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .actions a { color: var(--accent); }
    button { font: inherit; font-weight: 600; color: var(--ink); background: var(--card); border: 1px solid var(--line);
      border-radius: 10px; padding: 7px 14px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    #status { grid-column: 1 / -1; margin: 0; color: var(--soft); min-height: 0; }
    #status:empty { display: none; }
    main { max-width: 42rem; margin: 0 auto; padding: 32px 16px 160px; }
    article h2 { font-size: 1.35em; line-height: 1.25; margin: 1.6em 0 .5em; }
    article h3, article h4 { font-size: 1.12em; margin: 1.4em 0 .4em; }
    article p, article li { margin: 0 0 .9em; }
    .er-page { display: flex; gap: 12px; align-items: center; margin: 2.2em 0 1.2em; color: var(--soft);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .er-page::before, .er-page::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
    .er-page button { padding: 3px 10px; font-weight: 500; }
    .er-page a { color: var(--accent); }
    figure { margin: 0 0 1.6em; background: #fff; border: 1px solid var(--line); border-radius: 6px;
      box-shadow: var(--shadow); overflow: hidden; }
    figure canvas { display: block; width: 100%; height: auto; }
    .empty { margin-top: 18vh; text-align: center; color: var(--soft); }
    body.drag main { outline: 3px dashed var(--accent); outline-offset: 8px; border-radius: 12px; }
    @media (max-width: 560px) { .bar { grid-template-columns: 1fr; } .actions { justify-content: flex-start; } }
  </style>
</head>
<body data-state="loading">
  <header class="bar">
    <div>
      <p class="kicker">easy-read · PDF</p>
      <h1 id="title">Opening…</h1>
    </div>
    <nav class="actions" aria-label="PDF actions">
      <a id="original" target="_blank" rel="noreferrer" hidden>Original ↗</a>
      <a href="reading.html">Reading list</a>
      <button id="clean" type="button" class="primary" disabled>Clean up with Gemini</button>
      <button id="open" type="button">Open a PDF…</button>
      <input id="file" type="file" accept="application/pdf" hidden>
    </nav>
    <p id="status" role="status"></p>
  </header>
  <main><article id="text"></article></main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
